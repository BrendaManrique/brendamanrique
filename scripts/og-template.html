<!DOCTYPE html>
<!--
  OG image template for brendamanrique.com (1200x630).
  Rendered to public/og-image.png by scripts/generate-og-image.ts (Playwright).
  Replicates the home hero design tokens 1:1 (no AI-invented styling).
  Placeholders resolved at render time: __FONT_SG__ __FONT_DM__ __AVATAR__
  To change copy, edit the markup below — the script only injects fonts and the portrait.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 400 700;
    font-display: block;
    src: url('__FONT_SG__') format('woff2');
  }
  @font-face {
    font-family: 'DM Sans';
    font-weight: 400 600;
    font-display: block;
    src: url('__FONT_DM__') format('woff2');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    /* exact hero tokens: --background 38 33% 94% (paper), dot grid hsl(208 25% 35% / .14) 24px */
    background-color: hsl(38 33% 94%);
    background-image: radial-gradient(circle, hsl(208 25% 35% / 0.14) 1px, transparent 1px);
    background-size: 24px 24px;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: hsl(208 59% 15%);
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 90px;
    overflow: hidden;
    position: relative;
  }
  /* soft paper glow top-right, like the hero ambient */
  body::after {
    content: '';
    position: absolute;
    top: -180px; right: -180px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, hsl(0 0% 100% / 0.85), transparent 70%);
    pointer-events: none;
  }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar {
    width: 300px; height: 300px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid hsl(40 12% 83%);
    box-shadow: 0 18px 50px hsl(208 59% 15% / 0.10), 0 0 0 10px hsl(0 0% 100% / 0.45);
  }
  .content { display: flex; flex-direction: column; }
  .greeting {
    font-size: 30px;
    color: hsl(209 17% 33%);
    margin-bottom: 14px;
    font-weight: 500;
  }
  .greeting .handle {
    background-image: linear-gradient(to right, hsl(158 37% 28%), hsl(208 59% 20%));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 700;
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 70px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: hsl(208 59% 15%);
    margin-bottom: 18px;
  }
  .sub {
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 32px;
    line-height: 1.32;
    font-weight: 500;
    color: hsl(209 17% 33%);
    letter-spacing: -0.005em;
    margin-bottom: 32px;
  }
  .sub .stars { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sub .star { width: 26px; height: 26px; color: hsl(36 55% 34%); vertical-align: middle; }
  .sub .num { font-weight: 700; color: hsl(208 59% 15%); }
  .pills { display: flex; gap: 12px; align-items: center; }
  .pill {
    font-size: 22px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: 9999px;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }
  .pill.solid {
    border: 1px solid hsl(158 37% 28% / 0.55);
    background: hsl(158 37% 28% / 0.10);
    color: hsl(158 37% 22%);
  }
  .pill.ghost {
    border: 1px solid hsl(40 12% 83%);
    background: hsl(40 43% 97% / 0.55);
    color: hsl(209 17% 33%);
  }
  .domain {
    position: absolute;
    bottom: 54px; right: 90px;
    font-size: 26px;
    font-weight: 600;
    color: hsl(209 17% 45%);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="avatar-wrap">
    <img class="avatar" src="__AVATAR__" alt="" />
  </div>
  <div class="content">
    <div class="greeting">Hi, I'm <span class="handle">Brenda Manrique</span></div>
    <h1>Senior<br/>Software Engineer</h1>
    <div class="sub">I build useful software for complex systems:<br/>financial platforms, credit analytics and AI agents.</div>
    <div class="pills">
      <span class="pill solid">Applied AI</span>
      <span class="pill ghost">Berlin · remote</span>
    </div>
  </div>
  <div class="domain">brendamanrique.com</div>
</body>
</html>
